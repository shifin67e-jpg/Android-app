name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Setup and Missing Resources
        run: |
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-mdpi
          
          # Move Kotlin files
          find . -maxdepth 2 -name "*.kt" -exec mv {} app/src/main/java/com/example/app/ \; 2>/dev/null || true
          
          # Move AndroidManifest into proper directory
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/
          elif [ -f "app/AndroidManifest.xml" ]; then
            mv app/AndroidManifest.xml app/src/main/
          fi

          # Create dummy strings.xml
          echo '<resources><string name="app_name">Minebot AFK Manager</string></resources>' > app/src/main/res/values/strings.xml

          # Create dummy styles.xml for Theme.MyApplication
          echo '<resources><style name="Theme.MyApplication" parent="android:Theme.Material.Light.NoActionBar"/></resources>' > app/src/main/res/values/styles.xml

          # Create dummy xml backup rules
          echo '<data-extraction-rules><cloud-backup><include domain="sharedpref" path="."/></cloud-backup></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          echo '<full-backup-content/>' > app/src/main/res/xml/backup_rules.xml

          # Create dummy 1x1 transparent PNG for missing ic_launcher icons
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          # Configuration properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle

          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22' } }; allprojects { repositories { google(); mavenCentral() } }" > build.gradle

          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }; android { namespace 'com.example.app'; compileSdk 34; defaultConfig { applicationId 'com.example.app'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }; buildFeatures { compose true }; composeOptions { kotlinCompilerExtensionVersion '1.5.8' } }; dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.activity:activity-compose:1.8.2'; implementation platform('androidx.compose:compose-bom:2024.02.01'); implementation 'androidx.compose.ui:ui'; implementation 'androidx.compose.material3:material3' }" > app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
