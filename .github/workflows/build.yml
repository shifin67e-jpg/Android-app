name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Fix Directory & Create Gradle Resources
        run: |
          # 1. Prepare folder structure
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-mdpi

          # 2. Collect all Kotlin files into package folder and inject package declaration
          find . -name "*.kt" -not -path "./app/src/*" -exec mv {} app/src/main/java/com/example/app/ \; 2>/dev/null || true
          
          for file in app/src/main/java/com/example/app/*.kt; do
            if [ -f "$file" ]; then
              if ! grep -q "^package " "$file"; then
                sed -i '1s/^/package com.example.app\n\n/' "$file"
              fi
            fi
          done

          # 3. Fix AndroidManifest placement
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/
          elif [ -f "app/AndroidManifest.xml" ]; then
            mv app/AndroidManifest.xml app/src/main/
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:allowBackup="true" android:label="Minebot AFK Manager" android:supportsRtl="true"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          fi

          # 4. Create missing AAPT resources
          echo '<resources><string name="app_name">Minebot AFK Manager</string></resources>' > app/src/main/res/values/strings.xml
          echo '<resources><style name="Theme.MyApplication" parent="android:Theme.Material.Light.NoActionBar"/><style name="Theme.MinebotAFKManager" parent="android:Theme.Material.Light.NoActionBar"/></resources>' > app/src/main/res/values/styles.xml
          echo '<data-extraction-rules><cloud-backup><include domain="sharedpref" path="."/></cloud-backup></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          echo '<full-backup-content/>' > app/src/main/res/xml/backup_rules.xml

          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          # 5. Write configuration & properties files
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.configuration-cache=false" >> gradle.properties
          echo "include ':app'" > settings.gradle

          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22' } }; allprojects { repositories { google(); mavenCentral() } }" > build.gradle

          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }; android { namespace 'com.example.app'; compileSdk 34; defaultConfig { applicationId 'com.example.app'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' }; buildFeatures { compose true }; composeOptions { kotlinCompilerExtensionVersion '1.5.8' } }; dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.activity:activity-compose:1.8.2'; implementation platform('androidx.compose:compose-bom:2024.02.01'); implementation 'androidx.compose.ui:ui'; implementation 'androidx.compose.material3:material3' }" > app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
